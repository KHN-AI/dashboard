<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東華三院高可寧紀念小學校本應用程式</title>
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f0f4f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="p-6">

  <!-- 頂部導覽列 -->
  <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white text-xl font-bold shadow-md">
        <i class="fa-solid fa-cubes"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-gray-800">東華三院高可寧紀念小學校本應用程式</h1>
        <p class="text-xs text-gray-500">應用程式入口網頁</p>
      </div>
    </div>
    <div class="flex gap-3">
      <button onclick="exportData()" class="px-4 py-2 bg-white text-gray-700 rounded-xl border border-gray-200 hover:bg-gray-50 font-medium text-sm flex items-center gap-2 shadow-sm">
        <i class="fa-solid fa-right-from-bracket"></i> 備份 / 匯入
      </button>
      <button onclick="openModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium text-sm flex items-center gap-2 shadow-sm">
        <i class="fa-solid fa-plus"></i> 新增小程序
      </button>
    </div>
  </header>

  <!-- 搜尋與分類篩選列 -->
  <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-stretch md:items-center">
    <div class="relative flex-1 max-w-md">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
      <input type="text" id="searchInput" oninput="renderApps()" placeholder="搜尋小程序..." class="w-full pl-11 pr-4 py-2.5 bg-white border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-sm shadow-sm">
    </div>
    <div class="flex gap-2 flex-wrap" id="categoryContainer">
      <!-- 動態產生分類按鈕 -->
    </div>
  </div>

  <!-- 小程序卡片列表 -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6" id="appGrid">
    <!-- 動態渲染卡片 -->
  </div>

  <!-- 新增/編輯 Modal -->
  <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl relative">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold text-gray-800" id="modalTitle">新增小程序</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="appForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="appId">
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">程式名稱 *</label>
          <input type="text" id="appName" required placeholder="例如：空節搜尋器" class="w-full px-3.5 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">程式網址 (URL)</label>
          <input type="text" id="appUrl" placeholder="https://junesham2026.github.io/xxx 或完整網址" class="w-full px-3.5 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20">
          <p class="text-[11px] text-gray-400 mt-1">若僅填寫名稱（如 to-do-list），系統會自動加上 https://junesham2026.github.io/</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">分類</label>
          <input type="text" id="appCategory" placeholder="例如：實用工具、行政管理" class="w-full px-3.5 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-2">選擇圖示</label>
          <div class="grid grid-cols-6 gap-2" id="iconPicker">
            <!-- 動態選擇圖示 -->
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-2">主題顏色</label>
          <div class="flex gap-3" id="colorPicker">
            <!-- 動態選擇顏色 -->
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4">
          <button type="button" onclick="closeModal()" class="px-5 py-2 text-gray-600 font-medium text-sm hover:bg-gray-100 rounded-xl">取消</button>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-xl shadow-sm">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const GITHUB_BASE = "https://junesham2026.github.io/";
    const icons = ["fa-calculator", "fa-user-check", "fa-list-check", "fa-book-open", "fa-file-signature", "fa-calendar-days", "fa-magnifying-glass", "fa-cubes", "fa-clipboard-list", "fa-chart-pie", "fa-gear", "fa-folder"];
    const colors = ["#4f46e5", "#059669", "#ea580c", "#9333ea", "#e11d48", "#2563eb", "#334155"];

    let defaultApps = [
      { id: '1', name: '空節搜尋器', url: GITHUB_BASE + 'free-period', category: '實用工具', icon: 'fa-calculator', color: '#4f46e5' },
      { id: '2', name: '校服排隊系統', url: GITHUB_BASE + 'uniform-queue', category: '行政管理', icon: 'fa-user-check', color: '#059669' },
      { id: '3', name: '工作提示', url: GITHUB_BASE + 'task-tips', category: '實用工具', icon: 'fa-list-check', color: '#ea580c' },
      { id: '4', name: '教材', url: GITHUB_BASE + 'teaching-materials', category: '教學輔助', icon: 'fa-book-open', color: '#9333ea' },
      { id: '5', name: '通知表格', url: GITHUB_BASE + 'notice-forms', category: '行政管理', icon: 'fa-file-signature', color: '#e11d48' },
      { id: '6', name: 'Timetable時間表', url: '', category: '教學輔助', icon: 'fa-calendar-days', color: '#2563eb' },
      { id: '7', name: 'try', url: GITHUB_BASE + 'try', category: '未分類', icon: 'fa-calculator', color: '#2563eb' }
    ];

    let apps = JSON.parse(localStorage.getItem('twgh_apps')) || defaultApps;
    let selectedCategory = '全部程式';
    let currentIcon = icons[0];
    let currentColor = colors[0];

    function init() {
      setupPickers();
      renderCategories();
      renderApps();
    }

    function saveApps() {
      localStorage.setItem('twgh_apps', JSON.stringify(apps));
      renderCategories();
      renderApps();
    }

    function renderCategories() {
      const categories = ['全部程式', ...new Set(apps.map(a => a.category || '未分類'))];
      const container = document.getElementById('categoryContainer');
      container.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${cat}')" class="px-4 py-1.5 rounded-xl text-xs font-medium transition ${selectedCategory === cat ? 'bg-gray-900 text-white shadow' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}">
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderApps();
    }

    function renderApps() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('appGrid');
      
      const filtered = apps.filter(app => {
        const matchesCategory = selectedCategory === '全部程式' || (app.category || '未分類') === selectedCategory;
        const matchesSearch = app.name.toLowerCase().includes(search);
        return matchesCategory && matchesSearch;
      });

      grid.innerHTML = filtered.map(app => {
        const hasUrl = Boolean(app.url && app.url.trim() !== '');
        return `
          <div class="bg-white rounded-3xl p-5 shadow-sm hover:shadow-md transition border border-gray-100 flex flex-col items-center text-center relative group">
            <button onclick="deleteApp('${app.id}')" class="absolute top-3 right-3 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash-can text-xs"></i></button>
            
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-white text-2xl shadow-md mb-3" style="background-color: ${app.color || '#2563eb'}">
              <i class="fa-solid ${app.icon || 'fa-cubes'}"></i>
            </div>
            
            <h4 class="font-bold text-gray-800 text-sm mb-1">${app.name}</h4>
            <span class="px-2.5 py-0.5 bg-gray-100 text-gray-500 rounded-md text-[11px] mb-4">${app.category || '未分類'}</span>

            ${hasUrl ? `
              <a href="${app.url}" target="_blank" class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 transition">
                進入程式 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
            ` : `
              <button onclick="editUrl('${app.id}')" class="w-full py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 transition border border-amber-200/50">
                <i class="fa-solid fa-link text-[10px]"></i> 設定網址
              </button>
            `}
          </div>
        `;
      }).join('');
    }

    function setupPickers() {
      document.getElementById('iconPicker').innerHTML = icons.map(icon => `
        <button type="button" onclick="selectIcon('${icon}')" id="icon-${icon}" class="w-10 h-10 border rounded-xl flex items-center justify-center text-gray-600 hover:bg-gray-50 text-sm">
          <i class="fa-solid ${icon}"></i>
        </button>
      `).join('');

      document.getElementById('colorPicker').innerHTML = colors.map(color => `
        <button type="button" onclick="selectColor('${color}')" id="color-${color}" class="w-8 h-8 rounded-full border-2 border-white shadow-sm" style="background-color: ${color}"></button>
      `).join('');

      selectIcon(icons[0]);
      selectColor(colors[0]);
    }

    function selectIcon(icon) {
      currentIcon = icon;
      icons.forEach(i => {
        const el = document.getElementById(`icon-${i}`);
        if(el) el.className = `w-10 h-10 border rounded-xl flex items-center justify-center text-sm ${i === icon ? 'border-blue-600 bg-blue-50 text-blue-600 font-bold' : 'text-gray-600 border-gray-200'}`;
      });
    }

    function selectColor(color) {
      currentColor = color;
      colors.forEach(c => {
        const el = document.getElementById(`color-${c}`);
        if(el) el.style.outline = c === color ? '2px solid #2563eb' : 'none';
      });
    }

    function openModal(app = null) {
      document.getElementById('appId').value = app ? app.id : '';
      document.getElementById('appName').value = app ? app.name : '';
      document.getElementById('appUrl').value = app ? app.url : '';
      document.getElementById('appCategory').value = app ? app.category : '';
      document.getElementById('modalTitle').innerText = app ? '編輯小程序' : '新增小程序';
      
      selectIcon(app ? app.icon : icons[0]);
      selectColor(app ? app.color : colors[0]);
      
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('appForm').reset();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('appId').value || Date.now().toString();
      const name = document.getElementById('appName').value;
      let url = document.getElementById('appUrl').value.trim();
      const category = document.getElementById('appCategory').value.trim() || '未分類';

      if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
        url = GITHUB_BASE + url;
      }

      const appData = { id, name, url, category, icon: currentIcon, color: currentColor };
      const index = apps.findIndex(a => a.id === id);

      if (index > -1) {
        apps[index] = appData;
      } else {
        apps.push(appData);
      }

      saveApps();
      closeModal();
    }

    function editUrl(id) {
      const app = apps.find(a => a.id === id);
      if (app) openModal(app);
    }

    function deleteApp(id) {
      if (confirm('確定要刪除此小程序嗎？')) {
        apps = apps.filter(a => a.id !== id);
        saveApps();
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(apps));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "twgh_apps_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    init();
  </script>
</body>
</html>

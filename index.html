<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東華三院高可寧紀念小學校本應用程式</title>
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap');
    
    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #fbcfe8 50%, #fef3c7 100%);
      font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
      min-height: 100vh;
    }

    .cartoon-card {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .cartoon-card:hover {
      transform: translateY(-6px) scale(1.02);
    }

    .color-option {
      transition: transform 0.2s ease;
    }
    .color-option:hover {
      transform: scale(1.2);
    }
  </style>
</head>
<body class="p-4 md:p-8 relative overflow-x-hidden">

  <!-- 頁面背景卡通裝飾圖檔 -->
  <img src="中小團體愛心.jpg" alt="卡通學生" class="fixed -bottom-6 -left-6 w-48 md:w-64 opacity-20 hover:opacity-100 transition duration-500 pointer-events-none z-0">
  <img src="小二看書_2.jpg" alt="看書學生" class="fixed -top-6 -right-6 w-40 md:w-56 opacity-20 hover:opacity-100 transition duration-500 pointer-events-none z-0">

  <div class="max-w-7xl mx-auto relative z-10">

    <!-- 頂部標頭與校徽 -->
    <header class="bg-white/90 backdrop-blur-md rounded-3xl p-5 md:p-6 shadow-xl mb-6 border-4 border-yellow-300 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4 text-center md:text-left">
        <!-- 學校校徽 -->
        <img src="高可寧校徽.jpg" alt="東華三院高可寧紀念小學校徽" class="w-16 h-16 md:w-20 md:h-20 object-contain drop-shadow-md">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-blue-900 tracking-wide flex items-center gap-2">
            東華三院高可寧紀念小學
          </h1>
          <p class="text-sm md:text-base font-bold text-pink-500 mt-0.5">✨ 校本應用程式入口網頁 ✨</p>
        </div>
      </div>

      <!-- 操作按鈕區 -->
      <div class="flex flex-wrap gap-2.5 justify-center">
        <!-- 備份按鈕 -->
        <button onclick="exportData()" class="px-4 py-2.5 bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold rounded-2xl shadow-md border-2 border-amber-500 flex items-center gap-2 text-sm transition active:scale-95">
          <i class="fa-solid fa-download"></i> 備份資料
        </button>
        <!-- 匯入按鈕 -->
        <button onclick="triggerImport()" class="px-4 py-2.5 bg-emerald-400 hover:bg-emerald-500 text-emerald-950 font-bold rounded-2xl shadow-md border-2 border-emerald-500 flex items-center gap-2 text-sm transition active:scale-95">
          <i class="fa-solid fa-upload"></i> 匯入資料
        </button>
        <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">

        <!-- 新增小程序按鈕 -->
        <button onclick="openModal()" class="px-5 py-2.5 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-2xl shadow-md border-2 border-sky-600 flex items-center gap-2 text-sm transition active:scale-95">
          <i class="fa-solid fa-circle-plus text-base"></i> 新增小程序
        </button>
      </div>
    </header>

    <!-- 搜尋列與分類選單 -->
    <div class="bg-white/80 backdrop-blur-md rounded-3xl p-4 shadow-lg mb-8 border-2 border-sky-200 flex flex-col md:flex-row gap-4 justify-between items-center">
      <!-- 搜尋器 -->
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-sky-400"></i>
        <input type="text" id="searchInput" oninput="renderApps()" placeholder="搜尋小程序..." class="w-full pl-11 pr-4 py-2 bg-sky-50/80 border-2 border-sky-200 rounded-2xl focus:outline-none focus:border-sky-400 text-sm font-semibold text-gray-700">
      </div>

      <!-- 分類分頁 -->
      <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-1 md:pb-0" id="categoryContainer">
        <!-- 動態產生分類按鈕 -->
      </div>
    </div>

    <!-- 小程序卡片列表 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6" id="appGrid">
      <!-- 動態渲染卡片 -->
    </div>

  </div>

  <!-- 新增 / 編輯 Modal -->
  <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl border-4 border-yellow-300 relative max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-5 pb-3 border-b-2 border-gray-100">
        <h3 class="text-xl font-extrabold text-blue-900 flex items-center gap-2" id="modalTitle">
          <i class="fa-solid fa-wand-magic-sparkles text-yellow-400"></i> 新增小程序
        </h3>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-400 hover:bg-rose-100 hover:text-rose-500 font-bold flex items-center justify-center transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="appForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="appId">

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">程式名稱 *</label>
          <input type="text" id="appName" required placeholder="例如：空節搜尋器" class="w-full px-4 py-2 bg-gray-50 border-2 border-gray-200 rounded-2xl text-sm font-semibold focus:outline-none focus:border-sky-400">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">程式網址 (URL)</label>
          <input type="text" id="appUrl" placeholder="https://khn-ai.github.io/xxx 或完整網址" class="w-full px-4 py-2 bg-gray-50 border-2 border-gray-200 rounded-2xl text-sm font-semibold focus:outline-none focus:border-sky-400">
          <p class="text-[11px] text-gray-400 font-medium mt-1">若僅填寫名稱（如 to-do-list），系統會自動加上 https://khn-ai.github.io/</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">分類 *</label>
          <select id="appCategory" class="w-full px-4 py-2 bg-gray-50 border-2 border-gray-200 rounded-2xl text-sm font-semibold focus:outline-none focus:border-sky-400">
            <option value="實用工具">實用工具</option>
            <option value="行政管理">行政管理</option>
            <option value="教學輔助">教學輔助</option>
            <option value="學科程式">學科程式</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-2">選擇圖示</label>
          <div class="grid grid-cols-6 gap-2 bg-slate-50 p-3 rounded-2xl border-2 border-gray-100 max-h-36 overflow-y-auto" id="iconPicker">
            <!-- 動態產生圖示 -->
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-2">主題顏色（30種顏色選一）</label>
          <div class="grid grid-cols-10 gap-2 bg-slate-50 p-3 rounded-2xl border-2 border-gray-100" id="colorPicker">
            <!-- 動態產生 30 種顏色 -->
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4">
          <button type="button" onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold text-sm rounded-2xl transition">取消</button>
          <button type="submit" class="px-6 py-2.5 bg-sky-500 hover:bg-sky-600 text-white font-bold text-sm rounded-2xl shadow-md border-2 border-sky-600 transition">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const GITHUB_BASE = "https://khn-ai.github.io/";

    // 圖示選項
    const icons = [
      "fa-calculator", "fa-user-check", "fa-list-check", "fa-book-open", "fa-file-signature", 
      "fa-calendar-days", "fa-magnifying-glass", "fa-cubes", "fa-clipboard-list", "fa-chart-pie", 
      "fa-gear", "fa-folder", "fa-graduation-cap", "fa-pen-ruler", "fa-music", "fa-heart", 
      "fa-star", "fa-trophy", "fa-bell", "fa-clock", "fa-globe", "fa-display", "fa-comments", "fa-lightbulb"
    ];

    // 30 種主題顏色/漸層色彩
    const colors = [
      "#ef4444", "#f97316", "#f59e0b", "#eab308", "#84cc16", "#22c55e", "#10b981", "#14b8a6", "#06b6d4", "#0ea5e9",
      "#3b82f6", "#6366f1", "#8b5cf6", "#a855f7", "#d946ef", "#ec4899", "#f43f5e", "#64748b", "#475569", "#1e293b",
      "#0284c7", "#0d9488", "#15803d", "#b45309", "#c2410c", "#be123c", "#6b21a8", "#4338ca", "#1e40af", "#0f766e"
    ];

    // 預設數據
    const defaultApps = [
      { id: '1', name: '空節搜尋器', url: GITHUB_BASE + 'free-period', category: '實用工具', icon: 'fa-calculator', color: '#3b82f6' },
      { id: '2', name: '校服排隊系統', url: GITHUB_BASE + 'uniform-queue', category: '行政管理', icon: 'fa-user-check', color: '#10b981' },
      { id: '3', name: '工作提示', url: GITHUB_BASE + 'task-tips', category: '實用工具', icon: 'fa-list-check', color: '#f97316' },
      { id: '4', name: '教材', url: GITHUB_BASE + 'teaching-materials', category: '教學輔助', icon: 'fa-book-open', color: '#8b5cf6' },
      { id: '5', name: '通知表格', url: GITHUB_BASE + 'notice-forms', category: '行政管理', icon: 'fa-file-signature', color: '#ec4899' },
      { id: '6', name: 'Timetable時間表', url: '', category: '教學輔助', icon: 'fa-calendar-days', color: '#0ea5e9' },
      { id: '7', name: 'try', url: GITHUB_BASE + 'try', category: '學科程式', icon: 'fa-calculator', color: '#6366f1' }
    ];

    let apps = JSON.parse(localStorage.getItem('twgh_khn_apps')) || defaultApps;
    let selectedCategory = '全部程式';
    let currentIcon = icons[0];
    let currentColor = colors[0];

    function init() {
      setupPickers();
      renderCategories();
      renderApps();
    }

    function saveApps() {
      localStorage.setItem('twgh_khn_apps', JSON.stringify(apps));
      renderCategories();
      renderApps();
    }

    function renderCategories() {
      const categories = ['全部程式', '實用工具', '行政管理', '教學輔助', '學科程式'];
      const container = document.getElementById('categoryContainer');
      container.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${cat}')" class="px-4 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${selectedCategory === cat ? 'bg-sky-500 text-white shadow-md border-2 border-sky-600' : 'bg-white text-gray-600 border-2 border-gray-200 hover:bg-sky-50'}">
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderApps();
    }

    function renderApps() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('appGrid');
      
      const filtered = apps.filter(app => {
        const matchesCategory = selectedCategory === '全部程式' || (app.category || '學科程式') === selectedCategory;
        const matchesSearch = app.name.toLowerCase().includes(search);
        return matchesCategory && matchesSearch;
      });

      grid.innerHTML = filtered.map(app => {
        const hasUrl = Boolean(app.url && app.url.trim() !== '');
        return `
          <div class="cartoon-card bg-white/90 backdrop-blur-md rounded-3xl p-5 shadow-lg border-4 border-white flex flex-col items-center text-center relative group">
            
            <!-- 修改與刪除按鈕區 -->
            <div class="absolute top-3 right-3 flex gap-1.5 opacity-90 group-hover:opacity-100 transition">
              <button onclick="editApp('${app.id}')" title="修改程式" class="w-7 h-7 bg-amber-100 hover:bg-amber-200 text-amber-700 rounded-full flex items-center justify-center text-xs transition border border-amber-300">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button onclick="deleteApp('${app.id}')" title="刪除程式" class="w-7 h-7 bg-rose-100 hover:bg-rose-200 text-rose-600 rounded-full flex items-center justify-center text-xs transition border border-rose-300">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>

            <!-- 圖示 -->
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-white text-2xl shadow-md mb-3 mt-1" style="background-color: ${app.color || '#3b82f6'}">
              <i class="fa-solid ${app.icon || 'fa-cubes'}"></i>
            </div>
            
            <h4 class="font-extrabold text-gray-800 text-base mb-1">${app.name}</h4>
            <span class="px-3 py-0.5 bg-sky-100 text-sky-700 rounded-full text-[11px] font-bold mb-4">${app.category || '學科程式'}</span>

            ${hasUrl ? `
              <a href="${app.url}" target="_blank" class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 transition shadow-sm">
                進入程式 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
            ` : `
              <button onclick="editApp('${app.id}')" class="w-full py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 transition border-2 border-amber-200">
                <i class="fa-solid fa-link text-[10px]"></i> 設定網址
              </button>
            `}
          </div>
        `;
      }).join('');
    }

    function setupPickers() {
      // 設置圖示選擇器
      document.getElementById('iconPicker').innerHTML = icons.map(icon => `
        <button type="button" onclick="selectIcon('${icon}')" id="icon-${icon}" class="w-9 h-9 border-2 rounded-xl flex items-center justify-center text-gray-600 hover:bg-sky-50 text-sm">
          <i class="fa-solid ${icon}"></i>
        </button>
      `).join('');

      // 設置 30 色主題選擇器
      document.getElementById('colorPicker').innerHTML = colors.map(color => `
        <button type="button" onclick="selectColor('${color}')" id="color-${color}" class="color-option w-6 h-6 rounded-full border-2 border-white shadow-sm" style="background-color: ${color}"></button>
      `).join('');

      selectIcon(icons[0]);
      selectColor(colors[0]);
    }

    function selectIcon(icon) {
      currentIcon = icon;
      icons.forEach(i => {
        const el = document.getElementById(`icon-${i}`);
        if(el) el.className = `w-9 h-9 border-2 rounded-xl flex items-center justify-center text-sm ${i === icon ? 'border-sky-500 bg-sky-100 text-sky-600 font-bold' : 'text-gray-600 border-gray-200'}`;
      });
    }

    function selectColor(color) {
      currentColor = color;
      colors.forEach(c => {
        const el = document.getElementById(`color-${c}`);
        if(el) el.style.transform = c === color ? 'scale(1.3)' : 'scale(1)';
        if(el) el.style.boxShadow = c === color ? '0 0 0 2px #0284c7' : 'none';
      });
    }

    function openModal(app = null) {
      document.getElementById('appId').value = app ? app.id : '';
      document.getElementById('appName').value = app ? app.name : '';
      document.getElementById('appUrl').value = app ? app.url : '';
      document.getElementById('appCategory').value = app ? (app.category || '學科程式') : '實用工具';
      document.getElementById('modalTitle').innerHTML = app ? '<i class="fa-solid fa-pen-to-square text-amber-500"></i> 修改小程序' : '<i class="fa-solid fa-wand-magic-sparkles text-yellow-400"></i> 新增小程序';
      
      selectIcon(app ? app.icon : icons[0]);
      selectColor(app ? app.color : colors[0]);
      
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('appForm').reset();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('appId').value || Date.now().toString();
      const name = document.getElementById('appName').value;
      let url = document.getElementById('appUrl').value.trim();
      const category = document.getElementById('appCategory').value;

      // 自動補全網址前綴
      if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
        url = GITHUB_BASE + url;
      }

      const appData = { id, name, url, category, icon: currentIcon, color: currentColor };
      const index = apps.findIndex(a => a.id === id);

      if (index > -1) {
        apps[index] = appData;
      } else {
        apps.push(appData);
      }

      saveApps();
      closeModal();
    }

    function editApp(id) {
      const app = apps.find(a => a.id === id);
      if (app) openModal(app);
    }

    function deleteApp(id) {
      if (confirm('確定要刪除此小程序嗎？')) {
        apps = apps.filter(a => a.id !== id);
        saveApps();
      }
    }

    // 匯出 (備份)
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(apps, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "twgh_khn_apps_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // 觸發匯入
    function triggerImport() {
      document.getElementById('importFile').click();
    }

    // 執行匯入
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedApps = JSON.parse(e.target.result);
          if (Array.isArray(importedApps)) {
            apps = importedApps;
            saveApps();
            alert('成功匯入數據！');
          } else {
            alert('匯入的檔案格式有誤。');
          }
        } catch (err) {
          alert('解析 JSON 檔案時發生錯誤。');
        }
      };
      reader.readAsText(file);
    }

    init();
  </script>
</body>
</html>
